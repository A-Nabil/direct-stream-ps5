name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate. Linux is the clean environment: the suite shells out to tar and
  # checks POSIX file modes, both of which behave normally here.
  linux:
    name: Python ${{ matrix.python }} on Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The app targets 3.9+; test the floor and a current release.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install unar
        # Archive staging tests need an extraction tool. The bundled bin/unar is a
        # macOS binary, so Linux needs the packaged one.
        run: sudo apt-get update && sudo apt-get install -y unar

      - name: Byte-compile every module
        run: python -m compileall -q ps5_streamer.py transfer_core.py resolver.py zip_streamer.py browser_capture.py

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  # Windows is a real check, not a rubber stamp. Two tests fail there for
  # environment reasons unrelated to the code -- Git Bash tar reads a Windows
  # drive path as a remote host, and NTFS has no POSIX 0o600 mode -- so this
  # job accepts exactly those two and fails on anything else. Marking the
  # whole job informational instead would have hidden every real Windows
  # regression behind a permanently red tick nobody reads.
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        shell: bash
        run: |
          python -m unittest discover -s tests 2>&1 | tee /tmp/out.txt || true

          # "FAIL: name (module.Class.name)" -> "module.Class.name"
          grep -E '^(FAIL|ERROR): ' /tmp/out.txt > /tmp/lines.txt || true
          sed -E 's/^[A-Z]+: [^(]*\(([^)]*)\).*/\1/' /tmp/lines.txt | sort -u > /tmp/got.txt

          cat > /tmp/known_raw.txt <<'KNOWN'
          test_transfer.Integration.test_queue_restart_recovery
          test_zip_streamer.TestZipStreamer.test_tar_archive_extraction_pipeline
          KNOWN
          sed -E 's/^ +//' /tmp/known_raw.txt | sort -u > /tmp/known.txt

          comm -23 /tmp/got.txt /tmp/known.txt > /tmp/new.txt

          if [ ! -s /tmp/new.txt ]; then
            echo "No failures beyond the known Windows environment ones." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Windows failures that are not environment noise"
            echo ''
            echo 'These are not on the known-failure list, so treat them as regressions:'
            echo '```'
            cat /tmp/new.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
